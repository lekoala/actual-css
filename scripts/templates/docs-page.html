<!-- Generated by build-docs.js — do not edit directly -->
<!doctype html>
<html lang="en" data-site-root="{{siteRoot}}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} — Actual CSS</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" href="{{siteRoot}}assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#52396F">
  <link rel="stylesheet" href="{{actualCss}}">
  <link rel="stylesheet" href="{{themesCss}}">
  <link rel="stylesheet" href="{{docsCss}}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/plugins/autoloader/prism-autoloader.min.js"></script>
  <script src="{{actualJs}}" defer></script>
  <script src="{{docsJs}}" defer></script>
  {{themeInit}}
</head>

<body>
  <div class="app-shell">
    <header class="docs-header">
      <div class="center cluster docs-header-inner">
        <a class="navbar-brand" href="{{home}}">
          <!-- Mark inlined from docs/brand/mark.svg (C2PA-free copy of the
               supplied master). Fills follow the docs theme via --text/--primary,
               so the mark stays legible on every preset instead of tracking
               only the OS scheme. -->
          <svg class="docs-brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><title>Actual</title>
            <style>.ring { fill: var(--text, #52396F); } .bar { fill: var(--primary, #9B7BCB); } }</style>
            <path class="ring" fill-rule="evenodd" d="M124.7,451.9 L475.4,451.9 L300.1,71.9ZM406.6,407.9 L193.5,407.9 L300.1,177.0Z"/>
            <path class="bar" d="M36.6,451.9 L85.1,451.9 L241.7,112.6 L217.4,60.1Z"/>
          </svg>
          <span class="docs-brand-text">Actual CSS</span>
        </a>

        <div class="cluster">
          <label class="docs-theme-field">
            <span class="sr-only">Color scheme</span>
            <select class="select" data-docs-theme>
              {{themeOptions}}
            </select>
          </label>
          <button class="btn sm" type="button" data-docs-search>Search <kbd class="key">Ctrl K</kbd></button>
          <button class="btn sm ghost docs-menu-toggle" type="button" commandfor="docs-nav-drawer" command="show-modal"
            aria-haspopup="dialog" aria-controls="docs-nav-drawer" aria-label="Open navigation">Menu</button>
        </div>
      </div>
    </header>

    <div class="docs-shell center">
      <aside class="docs-sidebar scroller stable-gutter" aria-label="Documentation">
        {{navGroups}}
      </aside>

      <main class="docs-main">
        <article class="docs-article stack">
          <nav aria-label="Breadcrumb">
            <ol class="breadcrumb">
              <li><a href="{{home}}">Docs</a></li>
              <li><span aria-current="page">{{title}}</span></li>
            </ol>
          </nav>

          {{content}}

          <div class="cluster docs-source-links">
            <a class="btn sm ghost" href="{{editUrl}}" rel="noopener noreferrer">Edit on GitHub</a>
            <a class="btn sm ghost" href="{{markdownUrl}}" rel="noopener noreferrer">View Markdown</a>
          </div>
        </article>

        <nav class="cluster docs-prevnext" aria-label="Page navigation">
          {{prev}}
          {{next}}
        </nav>
      </main>

      <aside class="docs-toc scroller stable-gutter">
        <nav class="scrollspy" data-enhance="scrollspy" data-scrollspy-offset="80" aria-label="On this page">
          <p class="docs-nav-group">On this page</p>
          <ul class="nav-list docs-toc-list" data-docs-toc>
{{toc}}
          </ul>
        </nav>
      </aside>
    </div>

    <footer class="docs-footer">
      <p class="muted">Actual CSS documentation built with Actual CSS.</p>
    </footer>
  </div>

  <dialog class="drawer" id="docs-nav-drawer" closedby="any" aria-label="Documentation navigation">
    <header class="docs-drawer-header">
      <strong>Actual CSS</strong>
      <form method="dialog">
        <button class="close" type="submit" aria-label="Close navigation"></button>
      </form>
    </header>
    <div class="docs-drawer-theme">
      <label class="docs-theme-field">
        <span class="sr-only">Color scheme</span>
        <select class="select" data-docs-theme>
          {{themeOptions}}
        </select>
      </label>
    </div>
    <nav aria-label="Documentation">
      {{navGroups}}
    </nav>
  </dialog>

  <dialog class="modal docs-search-dialog" id="docs-search-dialog" closedby="any" aria-label="Search documentation">
    <button class="close"
            type="button"
            commandfor="docs-search-dialog"
            command="request-close"
            aria-controls="docs-search-dialog"
            aria-label="Close search"></button>
    <div class="stack">
      <header>
        <h2 class="docs-search-title">Search documentation</h2>
      </header>
      <form method="dialog" data-docs-search-form>
        <input class="input docs-search-input" type="search" placeholder="Search docs…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="docs-search-results" aria-autocomplete="list" />
      </form>
      <ul class="docs-search-results stack" data-docs-search-results id="docs-search-results" role="listbox" aria-label="Search results"></ul>
    </div>
  </dialog>
</body>

</html>
