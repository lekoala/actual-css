<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Column layout placement fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    * { transition-duration: 0s !important; }
    /* Fixed-width canvases: every assertion is about the twelve tracks of the
       canvas, never about the viewport. */
    .probe { width: var(--w); }
    .column-layout > * { outline: 1px solid; }

    /* The documented form: coordinates on an application class. */
    .main { --column-span: 8; }
    .aside { --column-start: 9; --column-span: 4; }

    /* Recomposition overrides the class with one rule of the same shape. */
    .recomposed .main,
    .recomposed .aside {
      --column-start: 1;
      --column-span: 12;
    }
  </style>
</head>
<body>
  <!-- Auto-placement: no start line anywhere, so peers must flow across the
       canvas rather than stack. This is what a definite default start breaks. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="auto-8-4">
      <section style="--column-span: 8">a</section>
      <aside style="--column-span: 4">b</aside>
    </div>
  </div>

  <!-- An unplaced child spans the canvas and still lets placed peers flow. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="mixed">
      <h2>head</h2>
      <div style="--column-span: 4">1</div>
      <div style="--column-span: 4">2</div>
      <div style="--column-span: 4">3</div>
    </div>
  </div>

  <!-- start + span, from application classes. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="start-span">
      <main class="main">m</main>
      <aside class="aside">s</aside>
    </div>
  </div>

  <!-- A start with no span runs to the canvas end, not to line 21. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="start-only">
      <aside style="--column-start: 9">s</aside>
    </div>
  </div>

  <!-- Centered article: 2 through 11. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="centered">
      <article style="--column-start: 2; --column-span: 10">a</article>
    </div>
  </div>

  <!-- Sixteen units do not fit twelve: the second region wraps. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="wrap">
      <div style="--column-span: 8">x</div>
      <div style="--column-span: 8">y</div>
    </div>
  </div>

  <!-- Mid-canvas placement. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="mid">
      <div style="--column-start: 3; --column-span: 4">g</div>
    </div>
  </div>

  <!-- Recomposition: the same classes, restacked by one rule. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout recomposed" data-case="recomposed">
      <main class="main">m</main>
      <aside class="aside">s</aside>
    </div>
  </div>

  <!-- A nested canvas keeps its own placement in the parent; its children do
       not inherit those coordinates. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout" data-case="nested-outer">
      <section class="column-layout" data-case="nested" style="--column-start: 3; --column-span: 8">
        <div>full</div>
        <div style="--column-span: 6">half</div>
      </section>
    </div>
  </div>

  <!-- Every span, alone on its own canvas, to check the full ladder. -->
  <div id="spans"></div>

  <!-- Narrow canvases: the tracks must shrink rather than force the canvas
       wider than its container. -->
  <div id="narrow"></div>

  <!-- Gap utilities are exact here: the track count never reads --gap. -->
  <div class="probe" style="--w: 1200px">
    <div class="column-layout gap-none" data-case="gap-none">
      <div style="--column-span: 6">1</div>
      <div style="--column-span: 6">2</div>
    </div>
  </div>

  <script>
    const spans = document.getElementById("spans");
    for (let n = 1; n <= 12; n += 1) {
      const probe = document.createElement("div");
      probe.className = "probe";
      probe.style.setProperty("--w", "1200px");
      probe.innerHTML = `<div class="column-layout"><div style="--column-span: ${n}" data-span="${n}">s</div></div>`;
      spans.append(probe);
    }

    const narrow = document.getElementById("narrow");
    for (const w of [1200, 640, 360, 280]) {
      const probe = document.createElement("div");
      probe.className = "probe";
      probe.style.setProperty("--w", w + "px");
      probe.innerHTML = `<div class="column-layout" data-narrow="${w}">
        <div style="--column-span: 8">m</div><div style="--column-span: 4">s</div>
      </div>`;
      narrow.append(probe);
    }
  </script>
</body>
</html>
