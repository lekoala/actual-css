<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prose specificity contract fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>* { transition-duration: 0s !important; }</style>
</head>
<body>
  <!-- Authored rich text only: application components belong outside prose. -->
  <div id="prose-link-ref" class="prose">
    <a id="prose-link" href="#">Plain prose link</a>
  </div>

  <!-- Direct-child flow composes the authored blocks. -->
  <div id="prose-flow" class="prose">
    <p id="flow-p1">First paragraph</p>
    <p id="flow-p2">Second paragraph</p>
    <h2 id="flow-h2">Heading</h2>
  </div>

  <!-- Prose itself may opt into a contextual surface. -->
  <section id="inverted-prose" class="prose inverted">
    <h2 id="inverted-prose-heading">Contextual heading</h2>
    <p id="inverted-prose-copy">Inverted authored content</p>
  </section>
</body>
</html>
