<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prose specificity contract fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    * { transition-duration: 0s !important; }

    /* An application contrasting band (theming.md recipe). */
    .band {
      --heading: var(--surface);
      background: var(--surface-solid);
      color: var(--surface);
    }
  </style>
</head>
<body>
  <!-- Authored rich text only: application components belong outside prose. -->
  <div id="prose-link-ref" class="prose">
    <a id="prose-link" href="#">Plain prose link</a>
  </div>

  <!-- Direct-child flow composes the authored blocks. -->
  <div id="prose-flow" class="prose">
    <p id="flow-p1">First paragraph</p>
    <p id="flow-p2">Second paragraph</p>
    <h2 id="flow-h2">Heading</h2>
  </div>

  <!-- Prose itself may sit on a contextual surface and follow its ink. -->
  <section id="band-prose" class="prose band">
    <h2 id="band-prose-heading">Contextual heading</h2>
    <p id="band-prose-copy">Authored content on a band</p>
  </section>
</body>
</html>
