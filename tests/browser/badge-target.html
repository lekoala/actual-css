<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge dismiss target fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>* { transition-duration: 0s !important; }</style>
</head>
<body>
  <!-- .sm (20px): a small disc, a 24px hit area around it. -->
  <span class="badge primary soft sm" id="sm"><i aria-hidden="true"></i>Design <button class="close" type="button" aria-label="Remove Design"></button></span>

  <!-- Default (24px): the disc is inset, so its hit area still extends it. -->
  <span class="badge primary soft" id="default"><i aria-hidden="true"></i>Design <button class="close" type="button" aria-label="Remove Design"></button></span>

  <!-- .lg (30px): the disc alone meets the floor; the hit area adds nothing. -->
  <span class="badge primary soft lg" id="lg"><i aria-hidden="true"></i>Design <button class="close" type="button" aria-label="Remove Design"></button></span>

  <!-- A thematic override (17px): the hit area holds the floor without
       inflating the badge. -->
  <span class="badge primary soft" id="custom" style="--badge-size: 17px"><i aria-hidden="true"></i>Design <button class="close" type="button" aria-label="Remove Design"></button></span>

  <span class="compact"><span class="badge" id="compact"><i aria-hidden="true"></i>Compact</span></span>
  <span><span class="badge" id="density-default"><i aria-hidden="true"></i>Default</span></span>
  <span class="spacious"><span class="badge" id="spacious"><i aria-hidden="true"></i>Spacious</span></span>

  <!-- Person chips: the avatar follows the badge, never its own 2.25rem scale.
       The aria-hidden avatar ties with the decorative-child rule on
       specificity, so it guards the exclusion. -->
  <span class="badge sm" id="avatar-sm"><span class="avatar"><abbr>AM</abbr></span>@ada</span>
  <span class="badge" id="avatar-default"><span class="avatar lg"><abbr>AM</abbr></span>@ada</span>
  <span class="badge lg" id="avatar-lg"><span class="avatar"><abbr>AM</abbr></span>@ada</span>
  <span class="badge lg" id="avatar-hidden"><span class="avatar" aria-hidden="true"><abbr>AM</abbr></span>@ada</span>
  <span class="badge lg" id="plain-lg">@ada</span>
</body>
</html>
