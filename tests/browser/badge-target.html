<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge dismiss target fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>* { transition-duration: 0s !important; }</style>
</head>
<body>
  <!-- .sm drops --density-compact-size to 1.25rem (20px); the 24px target floor
       must keep the button at 24x24 while the badge stays visually compact. -->
  <span class="badge primary soft sm" id="sm">Design <button type="button" aria-label="Remove Design"></button></span>

  <!-- Default density: 1.5rem == 24px at the default root size, so badge and
       button measure the same and the floor must not change the geometry. -->
  <span class="badge primary soft" id="default">Design <button type="button" aria-label="Remove Design"></button></span>

  <!-- .lg: 1.875rem, above the floor on both badge and target. -->
  <span class="badge primary soft lg" id="lg">Design <button type="button" aria-label="Remove Design"></button></span>

  <!-- A thematic override under the floor (17px): the floor holds the target at
       24px and still does not inflate the badge itself. -->
  <span class="badge primary soft" id="custom" style="--density-compact-size: 17px">Design <button type="button" aria-label="Remove Design"></button></span>
</body>
</html>
