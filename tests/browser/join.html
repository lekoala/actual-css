<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join outline border contract fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>* { transition-duration: 0s !important; }</style>
</head>
<body>
  <!-- First in tab order: two adjacent fields share a 1px edge, so the
       focused one must stack above the other or its line loses that edge. -->
  <div class="join" role="group" aria-label="Name">
    <input class="input" id="join-first" aria-label="First" value="Ada">
    <input class="input" id="join-second" aria-label="Last" value="Lovelace">
  </div>

  <!-- A neutral outline adopts the field border everywhere, not only in a
       field join; an explicit intent (.danger, .neutral) keeps its own edge. -->
  <div class="join" role="group">
    <input class="input" id="join-input" value="x">
    <button class="btn outline" id="join-default" type="button">Clear</button>
  </div>

  <div class="join" role="group">
    <input class="input">
    <button class="btn danger outline" id="join-danger" type="button">Delete</button>
  </div>

  <!-- The same edge outside a join: the button's own variant owns it. -->
  <input class="input" id="plain-input" aria-label="Plain field" value="x">
  <button class="btn outline" id="plain-outline" type="button">Clear</button>

  <!-- A control edge themed apart from --border: the action follows the
       field, not the structural border. -->
  <div class="join" role="group" style="--border-control: rgb(255 0 0)">
    <input class="input" id="join-control-input" value="x">
    <button class="btn outline" id="join-control-default" type="button">Clear</button>
  </div>

  <div class="join" role="group">
    <input class="input">
    <button class="btn neutral outline" id="join-neutral" type="button">Other</button>
  </div>

  <div class="join" role="group">
    <button class="btn outline" id="join-labelled" type="button">Previous month</button>
    <button class="btn outline icon-only" id="join-icon" type="button" aria-label="Next month">›</button>
  </div>

  <!-- A field one wrapper level deep (an inline custom element, blockified as
       a flex item) must fill the wrapper when a taller sibling stretches it. -->
  <div class="join" role="group">
    <x-field id="join-wrapper"><input class="input" id="join-wrapped" aria-label="Wrapped"></x-field>
    <button class="btn outline icon-only" id="join-tall" type="button" aria-label="Go" style="min-block-size: 3.5rem">›</button>
  </div>

  <!-- A stretched join: the full-width input takes the row, the button stays square. -->
  <div class="field" style="inline-size: 20rem">
    <div class="join">
      <input class="input" id="join-full-input" aria-label="Password">
      <button class="btn outline icon-only" id="join-full-icon" type="button" aria-label="Show">›</button>
    </div>
  </div>
</body>
</html>
