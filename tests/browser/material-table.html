<!doctype html>
<html lang="en">
<head>

    body { padding: 1rem; }

  <div class="table-wrap">
    <table id="other" class="table">
      <tbody><tr id="other-row"><td>Second table</td><td>Own anchor</td></tr></tbody>
    </table>
  </div>

</html>
