<!doctype html>
<!-- The theme sits on the root, as an adopter's single theme does: the control
     steps are root tokens that :root's selection and every size and density
     boundary read. Steps only, no re-selection: a root theme needs none. -->
<html lang="en" data-theme="brand">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Themed size and density fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    body { padding: 1rem; }
    [data-theme="brand"] {
      --control-pad-x-sm: 0.5rem;
      --control-pad-x-md: 0.75rem;
      --control-pad-x-lg: 1rem;
    }
  </style>
</head>
<body>
  <div class="cluster">
    <button class="btn sm" type="button" data-pad="sm">Small</button>
    <button class="btn" type="button" data-pad="default">Default</button>
    <button class="btn lg" type="button" data-pad="lg">Large</button>
    <span class="compact"><button class="btn" type="button" data-pad="compact">Compact</button></span>
    <span class="spacious"><button class="btn" type="button" data-pad="spacious">Spacious</button></span>
  </div>
</body>
</html>
