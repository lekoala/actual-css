<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inline visibility fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    /* Narrow boxes overflow on any font: many labels against a few words of
       room. Assertions compare rects, never a label width. */
    .box { inline-size: 12rem; margin-block: 1rem; }
    .spacer { block-size: 150vh; }
  </style>
</head>
<body>
  <!-- First in tab order. The test sizes it from its tabs so the next one
       shows only a sliver at the edge. -->
  <div class="box" data-strip="tabs-sliver"></div>
  <div class="box" data-strip="tabs-end"></div>
  <div class="box" data-strip="tabs-start"></div>
  <div class="box" data-strip="tabs-middle"></div>
  <div class="box" dir="rtl" data-strip="tabs-rtl"></div>
  <div hidden><div class="box" data-strip="tabs-hidden"></div></div>

  <!-- Link tabs have no runtime: the strip starts on its current page
       through scroll-initial-target alone. Not the last tab, so the scroll
       range does not clamp it flush against the end. -->
  <nav class="box" aria-label="Sections">
    <ul class="tabs" id="links-mid">
      <li><a class="tab" href="#a">General</a></li>
      <li><a class="tab" href="#b">Security</a></li>
      <li><a class="tab" href="#c">Billing</a></li>
      <li><a class="tab" href="#d" aria-current="page">Notifications</a></li>
      <li><a class="tab" href="#e">Integrations</a></li>
      <li><a class="tab" href="#f">Advanced</a></li>
    </ul>
  </nav>

  <!-- An authored item floor guarantees overflow independently of label wrapping. -->
  <div class="box">
    <ol class="steps steps-horizontal" id="steps-row" style="--step-min: 7rem">
      <li class="step-complete"><span class="step-label">Account</span></li>
      <li class="step-complete"><span class="step-label">Profile</span></li>
      <li class="step-complete"><span class="step-label">Delivery</span></li>
      <li aria-current="step"><span class="step-label">Payment</span></li>
      <li><span class="step-label">Confirmation</span></li>
    </ol>
  </div>

  <!-- Short names fit without an authored floor: nothing scrolls. -->
  <div class="box">
    <ol class="steps steps-horizontal" id="steps-fit">
      <li class="step-complete"><span class="step-label">Account</span></li>
      <li aria-current="step"><span class="step-label">Payment</span></li>
      <li><span class="step-label">Confirm</span></li>
    </ol>
  </div>

  <div class="spacer"></div>
  <!-- Below the fold: placing their tab must not scroll the page. A vertical
       rail is no scroll container, so its current tab must not target the
       page either. -->
  <div class="box" data-strip="tabs-below"></div>
  <nav class="box" aria-label="Sections below">
    <ul class="tabs" id="links-below">
      <li><a class="tab" href="#a">General</a></li>
      <li><a class="tab" href="#b">Security</a></li>
      <li><a class="tab" href="#c">Billing</a></li>
      <li><a class="tab" href="#d">Notifications</a></li>
      <li><a class="tab" href="#e" aria-current="page">Integrations</a></li>
    </ul>
  </nav>
  <nav class="box" aria-label="Rail below">
    <ul class="tabs" aria-orientation="vertical" id="rail-below">
      <li><a class="tab" href="#a">General</a></li>
      <li><a class="tab" href="#b" aria-current="page">Security</a></li>
    </ul>
  </nav>

  <script>
    // Selected index per strip; -1 selects the last tab.
    const selected = { "tabs-sliver": 0, "tabs-end": -1, "tabs-start": 0, "tabs-middle": 3, "tabs-rtl": -1, "tabs-hidden": -1, "tabs-below": -1 };
    const labels = ["General", "Security", "Billing", "Notifications", "Integrations", "Advanced"];
    for (const box of document.querySelectorAll("[data-strip]")) {
      const name = box.dataset.strip;
      const pick = selected[name] < 0 ? labels.length - 1 : selected[name];
      const tabs = labels.map((label, i) =>
        `<button class="tab" type="button" role="tab" id="${name}-${i}" aria-controls="${name}-p${i}" aria-selected="${i === pick}">${label}</button>`).join("");
      const panels = labels.map((_, i) => `<div role="tabpanel" id="${name}-p${i}"></div>`).join("");
      box.innerHTML = `<div class="tabs" data-enhance="tabs" role="tablist" aria-label="${name}" id="${name}">${tabs}</div>${panels}`;
    }
  </script>
</body>
</html>
