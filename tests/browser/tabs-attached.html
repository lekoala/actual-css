<!doctype html>
<html lang="en" data-theme="neo-brutalist">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attached tabs</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <link rel="stylesheet" href="../../src/css/themes/neo-brutalist.css">
  <script src="../../dist/actual.full.js" defer></script>
  <style>
    body { padding: var(--space-50); }
    main { max-inline-size: 44rem; margin-inline: auto; }
    .custom { --tab-panel-bg: rgb(240 240 255); --tab-panel-pad: 2rem; --tab-panel-shadow: none; }
  </style>
</head>
<body>
  <main>
    <div class="tabs-attached" id="attached">
      <div class="tabs" role="tablist" aria-label="Account" data-enhance="tabs">
        <button class="tab" type="button" role="tab" id="overview-tab" aria-selected="true" aria-controls="overview">Overview</button>
        <button class="tab primary" type="button" role="tab" id="activity-tab" aria-selected="false" aria-controls="activity" tabindex="-1">Activity</button>
        <button class="tab" type="button" role="tab" id="settings-tab" aria-selected="false" aria-controls="settings" tabindex="-1">Account settings</button>
        <button class="tab" type="button" role="tab" id="disabled-tab" aria-selected="false" aria-controls="disabled" tabindex="-1" disabled>Unavailable</button>
      </div>
      <section class="tab-panel" role="tabpanel" id="overview" aria-labelledby="overview-tab" tabindex="-1">
        Traffic is up 12% week over week, led by organic search.
        <div class="tabs" role="tablist" aria-label="Nested view">
          <button class="tab" role="tab" type="button" aria-selected="true" id="nested-tab">Nested view</button>
        </div>
      </section>
      <section class="tab-panel" role="tabpanel" id="activity" aria-labelledby="activity-tab" tabindex="-1" hidden>Recent activity appears here.</section>
      <section class="tab-panel" role="tabpanel" id="settings" aria-labelledby="settings-tab" tabindex="-1" hidden>Manage your account settings.</section>
      <section class="tab-panel" role="tabpanel" id="disabled" aria-labelledby="disabled-tab" hidden>Unavailable.</section>
    </div>
  </main>
</body>
</html>
