<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aria-current values fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
</head>
<body>
  <!-- Each group: the current value(s) the component supports, then values it
       must leave inert, then an item without the attribute as the reference. -->
  <ul class="tabs" id="tabs">
    <li><a class="tab" href="#a" aria-current="page" data-current>Page</a></li>
    <li><a class="tab" href="#b" aria-current="true" data-current>True</a></li>
    <li><a class="tab" href="#c" aria-current="false">False</a></li>
    <li><a class="tab" href="#d" aria-current="">Empty</a></li>
    <li><a class="tab" href="#e" data-reference>None</a></li>
  </ul>

  <ul class="nav-list" id="nav">
    <li><a class="nav-link" href="#a" aria-current="page" data-current>Page</a></li>
    <li><a class="nav-link" href="#b" aria-current="location" data-current>Location</a></li>
    <li><a class="nav-link" href="#c" aria-current="true">True</a></li>
    <li><a class="nav-link" href="#d" aria-current="false">False</a></li>
    <li><a class="nav-link" href="#e" aria-current="">Empty</a></li>
    <li><a class="nav-link" href="#f" data-reference>None</a></li>
  </ul>

  <div class="list" id="list">
    <a class="list-item" href="#a" aria-current="page" data-current>Page</a>
    <a class="list-item" href="#b" aria-current="true" data-current>True</a>
    <a class="list-item" href="#c" aria-current="false">False</a>
    <a class="list-item" href="#d" aria-current="">Empty</a>
    <a class="list-item" href="#e" data-reference>None</a>
  </div>

</body>
</html>
