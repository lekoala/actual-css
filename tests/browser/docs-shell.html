<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documentation shell width fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <link rel="stylesheet" href="../../scripts/docs/assets/docs.css">
  <style>* { transition-duration: 0s !important; }</style>
</head>
<body>
  <div class="app-shell">
    <header class="docs-header">
      <div class="center cluster docs-header-inner">
        <a class="navbar-brand" href="#">
          <span class="docs-brand-mark" aria-hidden="true"></span>
          Actual CSS
        </a>
        <div class="cluster">
          <label class="docs-theme-field">
            <span class="sr-only">Color scheme</span>
            <select class="select">
              <option>System</option>
              <option>Dark</option>
            </select>
          </label>
          <button class="btn sm" type="button" data-docs-search>Search <kbd class="key">Ctrl K</kbd></button>
          <button class="btn sm ghost docs-menu-toggle" type="button">Menu</button>
        </div>
      </div>
    </header>
    <div class="docs-shell center">
      <aside class="docs-sidebar">Navigation</aside>
      <main class="docs-main">Documentation content</main>
      <aside class="docs-toc">On this page</aside>
    </div>
  </div>
</body>
</html>
