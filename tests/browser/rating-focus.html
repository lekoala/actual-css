<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rating focus fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    * { transition-duration: 0s !important; }
  </style>
</head>
<body>
  <div class="rating primary" id="rating-primary">
    <input type="radio" name="r-primary" value="1" id="rp-1">
    <input type="radio" name="r-primary" value="2" id="rp-2">
    <input type="radio" name="r-primary" value="3" id="rp-3">
    <input type="radio" name="r-primary" value="4" id="rp-4">
    <input type="radio" name="r-primary" value="5" id="rp-5">
  </div>
  <div class="rating danger" id="rating-danger">
    <input type="radio" name="r-danger" value="1" id="rd-1">
    <input type="radio" name="r-danger" value="2" id="rd-2">
    <input type="radio" name="r-danger" value="3" id="rd-3">
    <input type="radio" name="r-danger" value="4" id="rd-4">
    <input type="radio" name="r-danger" value="5" id="rd-5">
  </div>
  <div class="rating warning" id="rating-warning">
    <input type="radio" name="r-warning" value="1" id="rw-1">
    <input type="radio" name="r-warning" value="2" id="rw-2">
    <input type="radio" name="r-warning" value="3" id="rw-3">
    <input type="radio" name="r-warning" value="4" id="rw-4">
    <input type="radio" name="r-warning" value="5" id="rw-5">
  </div>
</body>
</html>
