<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color swatch fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    * { transition-duration: 0s !important; }
  </style>
</head>
<body>
  <form id="form" class="stack" style="align-items: start">
    <!-- Tab order is the test's navigation path: keep the palette first. -->
    <fieldset class="field-group cluster" id="palette-static">
      <legend>Category color</legend>
      <label class="color-swatch" id="blue" style="--color-swatch-value: #2563eb"><input type="radio" name="category" value="#2563eb" aria-label="Blue" checked></label>
      <label class="color-swatch" id="white" style="--color-swatch-value: #ffffff"><input type="radio" name="category" value="#ffffff" aria-label="White"></label>
      <label class="color-swatch" id="navy" style="--color-swatch-value: #0b1a3a"><input type="radio" name="category" value="#0b1a3a" aria-label="Navy"></label>
      <label class="color-swatch" id="gray" style="--color-swatch-value: #9ca3af"><input type="radio" name="category" value="#9ca3af" aria-label="Gray" disabled></label>
    </fieldset>

    <div class="cluster">
      <label class="color-swatch sm" id="small" style="--color-swatch-value: #10b981"><input type="checkbox" name="tags" value="green" aria-label="Green"></label>
      <input class="switch" type="checkbox" role="switch" id="switch" aria-label="Switch">
      <label class="color-swatch" id="beside-switch" style="--color-swatch-value: #f59e0b"><input type="checkbox" name="tags" value="amber" aria-label="Amber"></label>
    </div>

    <!-- A tight two-row palette: 4px is under the hit area's natural reach. -->
    <div class="grid" id="palette-tight" style="--gap: 4px; --grid-columns: repeat(3, max-content)">
      <label class="color-swatch" id="t-1" style="--color-swatch-value: #f44336"><input type="radio" name="tight" value="1" aria-label="Red"></label>
      <label class="color-swatch" id="t-2" style="--color-swatch-value: #673ab7"><input type="radio" name="tight" value="2" aria-label="Deep purple"></label>
      <label class="color-swatch" id="t-3" style="--color-swatch-value: #2196f3"><input type="radio" name="tight" value="3" aria-label="Blue"></label>
      <label class="color-swatch" id="t-4" style="--color-swatch-value: #4caf50"><input type="radio" name="tight" value="4" aria-label="Green"></label>
      <label class="color-swatch" id="t-5" style="--color-swatch-value: #ffeb3b"><input type="radio" name="tight" value="5" aria-label="Yellow"></label>
    </div>

    <span class="field-label" id="accent-label">Accent color</span>
    <div class="flyout-trigger">
      <button class="color-swatch" type="button" id="trigger" data-enhance="flyout" aria-controls="accent-palette" aria-expanded="false" aria-labelledby="accent-label accent-name" style="--color-swatch-value: #2563eb"><span class="sr-only" id="accent-name">Blue</span></button>
      <div class="flyout" id="accent-palette" style="--flyout-pad: var(--space-30)" hidden>
        <div class="cluster" role="radiogroup" aria-labelledby="accent-label">
          <label class="color-swatch" id="a-blue" style="--color-swatch-value: #2563eb"><input type="radio" name="accent" value="#2563eb" aria-label="Blue" checked></label>
          <label class="color-swatch" id="a-green" style="--color-swatch-value: #10b981"><input type="radio" name="accent" value="#10b981" aria-label="Green"></label>
          <label class="color-swatch" id="a-amber" style="--color-swatch-value: #f59e0b"><input type="radio" name="accent" value="#f59e0b" aria-label="Amber"></label>
        </div>
      </div>
    </div>

    <span class="field-label" id="brand-label">Brand color</span>
    <div class="flyout-trigger">
      <button class="color-swatch" type="button" id="brand-trigger" data-enhance="flyout" aria-controls="brand-palette" aria-expanded="false" aria-labelledby="brand-label brand-name" style="--color-swatch-value: #2563eb"><span class="sr-only" id="brand-name">Blue</span></button>
      <div class="flyout stack" id="brand-palette" data-flyout-auto-close="outside" style="--flyout-pad: var(--space-30)" hidden>
        <div class="cluster" role="radiogroup" aria-labelledby="brand-label">
          <label class="color-swatch" id="b-blue" data-flyout-close style="--color-swatch-value: #2563eb"><input type="radio" name="brand" value="#2563eb" aria-label="Blue" checked></label>
          <label class="color-swatch" id="b-green" data-flyout-close style="--color-swatch-value: #10b981"><input type="radio" name="brand" value="#10b981" aria-label="Green"></label>
          <label class="color-swatch" id="b-amber" data-flyout-close style="--color-swatch-value: #f59e0b"><input type="radio" name="brand" value="#f59e0b" aria-label="Amber"></label>
        </div>
        <label class="cluster" id="b-custom-row"><input class="color" type="color" id="b-custom" name="brand-custom" value="#7048e8"> Custom…</label>
      </div>
    </div>
  </form>

  <script>
    // Application code, as in the docs recipe: the trigger shows the pick.
    document.getElementById("accent-palette").addEventListener("change", (event) => {
      const trigger = document.getElementById("trigger");
      trigger.style.setProperty("--color-swatch-value", event.target.value);
      document.getElementById("accent-name").textContent = event.target.getAttribute("aria-label");
    });

    // Palette plus custom color: a custom pick unchecks the palette, so the
    // form carries brand, or brand-custom when no palette color is checked.
    const brand = document.getElementById("brand-palette");
    brand.addEventListener("change", (event) => {
      const custom = event.target.type === "color";
      if (custom) for (const radio of brand.querySelectorAll('[type="radio"]')) radio.checked = false;
      document.getElementById("brand-trigger").style.setProperty("--color-swatch-value", event.target.value);
      document.getElementById("brand-name").textContent = custom
        ? `Custom ${event.target.value}`
        : event.target.getAttribute("aria-label");
    });
  </script>
</body>
</html>
