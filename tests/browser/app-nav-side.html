<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App nav side fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
</head>
<body>
  <div class="app-layout">
    <header class="topbar">Top</header>
    <main class="app-main">Main</main>
    <nav class="app-nav" aria-label="Primary">
      <a href="#today" id="current" aria-current="page">
        <span aria-hidden="true" id="current-icon">☀</span>
        <span id="current-label">Today</span>
      </a>
      <a href="#tasks" id="other">
        <span aria-hidden="true" id="other-icon">✓</span>
        <span id="other-label">Tasks</span>
      </a>
    </nav>
  </div>
</body>
</html>
