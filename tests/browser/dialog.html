<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dialog lifecycle fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
</head>
<body>
  <div style="height: 1200px"></div>

  <button id="open-dismissible" type="button" commandfor="dlg-dismissible" command="show-modal">Open dismissible</button>
  <button id="open-nondismiss" type="button" commandfor="dlg-nondismiss" command="show-modal">Open non-dismissible</button>
  <button id="open-scrollable" type="button" commandfor="dlg-scrollable" command="show-modal">Open scrollable</button>
  <button id="open-drawer" type="button" commandfor="drawer" command="show-modal">Open drawer</button>
  <button id="open-thick" type="button" commandfor="dlg-thick" command="show-modal">Open thick</button>

  <dialog class="modal" id="dlg-dismissible" closedby="any" data-dialog-dismissible aria-label="Dismissible dialog">
    <button class="close"
            type="button"
            commandfor="dlg-dismissible"
            command="request-close"
            aria-label="Close"></button>
    <div class="stack">
      <header><h3>Dismissible dialog</h3></header>
      <p>Body content.</p>
    </div>
  </dialog>

  <dialog class="modal" id="dlg-nondismiss" aria-label="Non dismissible dialog">
    <button class="close"
            type="button"
            commandfor="dlg-nondismiss"
            command="request-close"
            aria-label="Close"></button>
    <div class="stack">
      <header><h3>Non-dismissible dialog</h3></header>
      <p>Body content.</p>
    </div>
  </dialog>

  <dialog class="modal scrollable" id="dlg-scrollable" aria-label="Scrollable dialog">
    <div class="stack">
      <header><h3>Scrollable dialog</h3></header>
      <div id="modal-scroll-body">
        <input id="modal-edge-control" style="inline-size: 100%" value="Full-width control">
      </div>
      <footer><button type="button">Action</button></footer>
    </div>
  </dialog>

  <!-- A theme with a thicker component line (bootstrap-v6 sets 3px): a
       full-width action draws it outside its box, past the :focus baseline. -->
  <dialog class="modal scrollable" id="dlg-thick" aria-label="Thick focus dialog" style="--focus-ring-width: 3px">
    <div class="stack">
      <header><h3>Thick focus line</h3></header>
      <div id="thick-scroll-body">
        <button class="btn" id="thick-edge-button" type="button" style="inline-size: 100%">Full-width action</button>
      </div>
    </div>
  </dialog>

  <dialog class="drawer" id="drawer" aria-label="Drawer">
    <header>
      <strong>Drawer</strong>
      <form method="dialog">
        <button class="close" type="submit" aria-label="Close"></button>
      </form>
    </header>
    <nav>
      <ul class="nav-list"><li><a class="nav-link" id="drawer-edge-control" href="#">Item</a></li></ul>
    </nav>
  </dialog>

  <div style="height: 2000px"></div>

  <script src="../../dist/actual.full.js" defer></script>
</body>
</html>
