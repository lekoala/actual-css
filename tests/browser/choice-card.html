<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choice card fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
</head>
<body>
  <form id="form" class="stack" style="inline-size: 24rem">
    <label id="me" class="choice-card">
      <input type="radio" name="patient" value="me">
      <strong id="me-name">Acelya Lejeune</strong>
      <span class="muted">Me</span>
    </label>
    <label id="partner" class="choice-card">
      <input type="radio" name="patient" value="partner">
      <strong>Sirius Black</strong>
      <span class="muted">Partner</span>
    </label>
    <label id="long" class="choice-card">
      <input type="radio" name="patient" value="long">
      <strong>Marie-Charlotte de Villers-Delacroix Vandenbroucke-Snoeck, a name that wraps</strong>
      <span class="muted">Daughter</span>
    </label>
    <label id="topping" class="choice-card">
      <input type="checkbox" name="topping" value="egg">
      <strong>Egg</strong>
    </label>
  </form>
</body>
</html>
