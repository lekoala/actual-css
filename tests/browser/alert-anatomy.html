<!doctype html>
<!-- Icon + title + body: a tall icon (a theme tile) and a stretched alert
     (equal-height grid row) must not open a gap under the title. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alert anatomy fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    body { padding: 1rem; }
    /* Taller than one line, shorter than title + body: the contract. */
    .tall { --alert-icon-size: 2.5rem; }
    .stretched { block-size: 12rem; }
    /* Alignment cases: the derived offset must follow each hook. */
    .small-text { --alert-font-size: 0.875rem; }
    .tight-leading { --alert-line-height: 1.25; }
    .large-icon { --alert-icon-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="stack">
    <div class="alert" id="plain">
      <i class="alert-icon" aria-hidden="true"></i>
      <strong>Title</strong>
      <p>Body</p>
    </div>
    <div class="alert tall" id="tall">
      <i class="alert-icon" aria-hidden="true"></i>
      <strong>Title</strong>
      <p>Body</p>
    </div>
    <div class="alert stretched" id="stretched">
      <i class="alert-icon" aria-hidden="true"></i>
      <strong>Title</strong>
      <p>Body</p>
    </div>

    <!-- One block, one line: its rect is the line box the icon is centred on. -->
    <div class="alert" id="measure">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Message</div>
    </div>
    <div class="alert small-text" id="measure-small-text">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Message</div>
    </div>
    <div class="alert tight-leading" id="measure-tight-leading">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Message</div>
    </div>
    <div class="alert large-icon" id="measure-large-icon">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Message</div>
    </div>
    <div class="alert" id="measure-multiline">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>First line<br>Second line</div>
    </div>

    <!-- The dismiss button is taller than the line: centred on it like the
         icon, and without growing the title row. -->
    <div class="alert" id="dismiss">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Title</div>
      <p>Body</p>
      <button type="button" class="close" aria-label="Dismiss"></button>
    </div>
    <div class="alert small-text" id="dismiss-small-text">
      <i class="alert-icon" aria-hidden="true"></i>
      <div>Message</div>
      <button type="button" class="close" aria-label="Dismiss"></button>
    </div>
    <div class="alert admonition" id="admonition">
      <div class="alert-title">
        <svg class="alert-icon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>
        <span>Title</span>
        <button type="button" class="close" aria-label="Dismiss"></button>
      </div>
      <div class="alert-body"><p>Body</p></div>
    </div>
  </div>
</body>
</html>
