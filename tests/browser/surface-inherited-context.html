<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surface inherited-context fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <script src="../../dist/actual.full.js" defer></script>
  <style>
    /* An application-defined inherited hook — the pattern Actual invites
       adopters to use for their own scoped tokens. */
    #app-scope {
      --app-accent: rgb(1, 2, 3);
    }
  </style>
</head>
<body style="margin: 0; padding: 1rem">
  <!-- Each flyout sits inside a scope that reaches it only by inheritance.
       surface.js reparents an open surface to the nearest dialog or to body,
       which severs every one of these. -->

  <div id="theme-scope" data-theme="dark" style="padding: 1rem">
    <div class="flyout-trigger">
      <button class="btn" type="button" data-enhance="flyout" aria-controls="theme-panel">
        Theme
      </button>
      <ul id="theme-panel" class="flyout menu" hidden>
        <li><button class="menu-item" type="button">Item</button></li>
      </ul>
    </div>
  </div>

  <div id="density-scope" class="sm" style="padding: 1rem">
    <div class="flyout-trigger">
      <button class="btn" type="button" data-enhance="flyout" aria-controls="density-panel">
        Density
      </button>
      <ul id="density-panel" class="flyout menu" hidden>
        <li><button class="menu-item" type="button">Item</button></li>
      </ul>
    </div>
  </div>

  <div id="app-scope" style="padding: 1rem">
    <div class="flyout-trigger">
      <button class="btn" type="button" data-enhance="flyout" aria-controls="app-panel">
        App hook
      </button>
      <ul id="app-panel" class="flyout menu" hidden>
        <li><button class="menu-item" type="button">Item</button></li>
      </ul>
    </div>
  </div>
</body>
</html>
