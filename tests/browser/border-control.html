<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control border role fixture</title>
  <link rel="stylesheet" href="../../src/css/actual.full.css">
  <style>
    * { transition-duration: 0s !important; }

    /* One role, set once: controls take it, separators keep --border. */
    :root {
      --border: rgb(200 200 200);
      --border-control: rgb(255 0 0);
    }
  </style>
</head>
<body>
  <!-- Text fields read --control-default-border: quiet by default, the
       control edge under increased contrast. -->
  <input class="input" data-field aria-label="Input">
  <textarea class="textarea" data-field aria-label="Textarea"></textarea>
  <select class="select" data-field aria-label="Select"><option>One</option></select>
  <div class="join">
    <span class="join-addon" data-field>https://</span>
    <input class="input" aria-label="Address">
  </div>
  <div class="otp" aria-label="Code">
    <input type="text" inputmode="numeric" maxlength="1" aria-label="Code">
    <span aria-hidden="true" data-field data-name="otp-cell"></span>
  </div>
  <input class="check" type="checkbox" data-control aria-label="Check">
  <input class="radio" type="radio" data-control aria-label="Radio">
  <!-- A switch takes --border-control as its whole resting track, read in its
       own test: the fill, not a ring. -->
  <input class="switch" type="checkbox" role="switch" data-resting-switch aria-label="Switch">
  <!-- .color draws its edge on ::-webkit-color-swatch, which getComputedStyle
       cannot read; css-audit checks that rule's source instead. -->
  <label class="color-swatch" data-control data-pseudo="::before"><input type="radio" name="swatch" aria-label="Swatch"></label>
  <label class="choice-card" data-control>
    <input class="radio" type="radio" name="plan">
    <span>Plan</span>
  </label>
  <!-- A labelled outline action is identified by its text: it keeps the
       surface --border alone, and takes the field edge as a field segment. -->
  <button class="btn outline" data-separator type="button">Outline</button>
  <div class="join" style="--control-default-border: rgb(0 160 160)">
    <input class="input" aria-label="Search">
    <button class="btn outline" id="joined-outline" type="button">Go</button>
  </div>
  <div class="join" id="button-join">
    <button class="btn outline" type="button">A</button>
    <button class="btn outline" type="button">B</button>
  </div>
  <button class="btn outline primary" id="intent-outline" type="button">Intent</button>
  <span id="ref-text" style="color: var(--text)"></span>
  <span id="ref-primary" style="color: var(--primary)"></span>

  <!-- A theme moves the resting field edge with --control-default-border and
       can keep 3:1 on the lower edge only. Choices keep --border-control;
       readonly and disabled drop the inherited lower edge; validation wins. -->
  <div id="recipe" style="--control-default-border: rgb(0 128 0); --control-border-block-end-color: rgb(0 0 255)">
    <input class="input" data-recipe="input" aria-label="Recipe input">
    <textarea class="textarea" data-recipe="textarea" aria-label="Recipe textarea"></textarea>
    <select class="select" data-recipe="select" aria-label="Recipe select"><option>One</option></select>
    <div class="join"><span class="join-addon" data-recipe="addon">@</span><input class="input" aria-label="Recipe joined"><button class="btn outline" data-recipe="join-button" type="button">Go</button></div>
    <input class="check" type="checkbox" data-recipe="check" aria-label="Recipe check">
    <input class="input" data-recipe="readonly" readonly value="Read only" aria-label="Recipe readonly">
    <input class="input" data-recipe="disabled" disabled aria-label="Recipe disabled">
    <label class="field danger"><input class="input" data-recipe="invalid" aria-label="Recipe invalid"></label>
    <!-- Underline-only recipe: forced colors must draw its sides again. -->
    <input class="input" data-recipe="underline" style="--control-default-border: transparent" aria-label="Underline field">
  </div>

  <!-- A switch keeps the control edge at rest only: checked and disabled
       tracks are a uniform fill, and validation still wins over the edge. -->
  <input class="switch" type="checkbox" role="switch" data-switch="checked" checked aria-label="Checked switch">
  <input class="switch" type="checkbox" role="switch" data-switch="disabled" disabled aria-label="Disabled switch">
  <input class="switch" type="checkbox" role="switch" data-switch="invalid" aria-invalid="true" aria-label="Invalid switch">
  <span data-switch-danger style="color: var(--danger)"></span>

  <!-- In a dark scheme the --border-control track sits above the surface: the
       resting knob is the opaque surface it is calibrated against, dark like
       the checked knob, not --surface-raised. -->
  <div data-theme="dark">
    <input class="switch" type="checkbox" role="switch" data-dark-switch aria-label="Dark switch">
    <input class="switch" type="checkbox" role="switch" data-dark-checked checked aria-label="Dark checked switch">
    <span data-dark-surface style="color: var(--surface-opaque)"></span>
  </div>

  <div class="card" data-separator>Card</div>
  <hr class="divider" data-separator>

  <!-- An island recomputes the derived edge from its own ink and mix. -->
  <div data-theme="mix-probe" style="--text: rgb(0 0 255); --surface: rgb(255 255 255); --border-control-mix: 100%">
    <input class="check" type="checkbox" data-mix aria-label="Mixed">
  </div>
  <span data-mix-expected style="color: color-mix(in oklab, rgb(0 0 255) 100%, rgb(255 255 255))"></span>
</body>
</html>
