<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Admini on Actual CSS</title>
  <meta name="description" content="Custom 404 error page with navigation back to the dashboard.">

  <script src="../../scripts/theme-picker.js" data-storage="admini-theme"></script>
  <link rel="stylesheet" href="../../../dist/actual.full.css">
  <link rel="stylesheet" href="../../assets/actual-themes.min.css">
  <link rel="stylesheet" href="admini.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
</head>

<body>
  <div class="admini-error stack items-center">
    <p class="admini-error-code">404</p>
    <hgroup>
      <h1>Page not found</h1>
      <p class="muted">The page you're looking for doesn't exist or was moved.</p>
    </hgroup>

    <div class="cluster" style="justify-content: center;">
      <a class="btn primary" href="index.html">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
        Back to dashboard
      </a>
      <a class="btn neutral outline" href="mailto:support@example.com">Contact support</a>
    </div>

    <theme-picker><select class="select sm fit" aria-label="Switch theme"></select></theme-picker>
  </div>

  <script src="../../../dist/actual.full.js" defer></script>

</body>

</html>
