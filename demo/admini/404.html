<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Admini on Actual CSS</title>
  <meta name="description" content="Custom 404 error page with illustration and navigation back to dashboard.">
  <link rel="stylesheet" href="../../src/css/actual.css">
  <link rel="stylesheet" href="../../src/css/themes/index.css">
  <link rel="stylesheet" href="admini.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
</head>

<body>
  <div class="admini-error stack" style="align-items: center; text-align: center;">
    <p class="admini-error-code">404</p>
    <hgroup>
      <h1>Page not found</h1>
      <p class="muted">The page you're looking for doesn't exist or was moved.</p>
    </hgroup>

    <label class="field" style="inline-size: 100%; max-inline-size: 24rem;">
      <span class="field-label sr-only">Search</span>
      <input class="input" type="search" placeholder="Search the workspace&hellip;" aria-label="Search the workspace">
    </label>

    <div class="cluster" style="justify-content: center;">
      <a class="btn primary" href="index.html">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>
        Back to dashboard
      </a>
      <a class="btn neutral outline" href="mailto:support@example.com">Contact support</a>
    </div>
  </div>

  <script src="../../dist/actual.js"></script>
</body>

</html>
