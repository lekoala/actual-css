<!doctype html>
<html lang="en" data-theme="ios-demo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iOS-style settings - Actual CSS</title>
  <meta name="description" content="A stress test of the theme contract: iOS-like controls and grouped settings from unchanged framework markup.">
  <link rel="stylesheet" href="../../dist/actual.full.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <style>
    /* 1. Theme — tokens and public hooks only. */
    [data-theme="ios-demo"] {
      color-scheme: light dark;

      --font-sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", sans-serif;

      --primary: light-dark(#0071e3, #0a84ff);
      --primary-fg: light-dark(#fff, #fff);
      --success: light-dark(#248a3d, #30d158);
      --success-fg: light-dark(#fff, #000);
      --warning: light-dark(#c93400, #ff9f0a);
      --warning-fg: light-dark(#fff, #000);
      --danger: light-dark(#d70015, #ff453a);
      --danger-fg: light-dark(#fff, #000);
      --neutral: light-dark(#8e8e93, #8e8e93);
      --neutral-fg: light-dark(#fff, #000);

      /* Grouped page: grey page, white groups, a recessed fill for tracks. */
      --surface: light-dark(#f2f2f7, #000);
      --surface-raised: light-dark(#fff, #1c1c1e);
      --surface-subtle: light-dark(#e3e3e8, #2c2c2e);
      --surface-solid: light-dark(#1c1c1e, #f2f2f7);

      --text: light-dark(#000, #fff);
      --text-muted: light-dark(#6c6c70, #98989f);
      --text-subtle: light-dark(#6c6c70, #98989f);

      --border: light-dark(#d1d1d6, #38383a);
      --border-control: light-dark(#c7c7cc, #48484a);
      --focus: light-dark(#0071e3, #0a84ff);
      --hover-overlay: light-dark(rgb(0 0 0 / 4%), rgb(255 255 255 / 6%));
      --shadow-color: #000;

      --radius-sm: 0.5rem;
      --radius: 0.625rem;
      --radius-lg: 1.25rem;

      --soft-bg-mix: 85%;

      background: var(--surface);
    }

    [data-theme="ios-demo"] .card { --card-radius: var(--radius-lg); }
    [data-theme="ios-demo"] .btn { --btn-radius: var(--radius-sm); }

    /* Zero specificity: the off colors are base hooks, and a theme-weight rule
       would also override the checked state's. */
    :where([data-theme="ios-demo"]) .switch {
      --switch-bg: light-dark(#e9e9eb, #39393d);
      --switch-border: transparent;
      --switch-knob: #fff;
      --switch-block-size: 1.75rem;
      --switch-width: 3.875rem;
      --switch-knob-margin: 0.125rem;
      --switch-knob-inline-size: 2.375rem;
    }

    [data-theme="ios-demo"] .range {
      --range-track-height: 0.25rem;
      --range-thumb-size: 1.75rem;
      --range-thumb-bg: #fff;
    }

    /* iOS labels keep full ink; the selected segment lightens in dark, above
       the track (the dark surface-raised sits below surface-subtle), and is
       set apart by its fill and shadow with only a faint edge. */
    [data-theme="ios-demo"] .segmented {
      --segmented-pad: 0.125rem;
      --segmented-radius: var(--radius-sm);
      --segmented-fg: var(--text);
      --segmented-selected-bg: light-dark(#fff, #636366);
      --segmented-selected-border: light-dark(rgb(0 0 0 / 4%), transparent);
    }

    [data-theme="ios-demo"] .list {
      --list-item-pad-inline: var(--space-40);
      --list-item-pad-block: var(--space-20);
      /* Not the page's section --gap, which the rows would otherwise inherit. */
      --list-item-gap: var(--space-30);
    }

    /* Icon tiles: a square avatar painted by its intent. */
    [data-theme="ios-demo"] .list .avatar {
      --avatar-size: 1.75rem;
      --avatar-radius: var(--radius-sm);
      --avatar-font-size: 1.125rem;
    }

    /* Page proportions belong to the demo. */
    .ios-page {
      --center-size: 52rem;
      --gap: var(--space-60);

      padding-block: var(--space-60);
      padding-inline: var(--space-40);
    }

    .ios-gallery { --grid-min: 14rem; }
    .ios-narrow { inline-size: 15rem; }
    .ios-gallery figure {
      --gap: var(--space-20);

      margin: 0;
    }

    .ios-stage {
      display: grid;
      place-items: center;
      min-block-size: 9rem;
    }

    /* 2. Findings — every rule below is something the theme could not reach. */

    /* F1. Grouped list: the rows run edge to edge in their card. The card pad
       hook reaches it; the list's leading divider has no hook of its own. */
    [data-theme="ios-demo"] .card:has(> .list) { --card-pad: 0; }
    [data-theme="ios-demo"] .card > .list { border-block-start: 0; }

    /* A row's hover fill would square off the card's corner. */
    [data-theme="ios-demo"] .card > .list > li:first-child > .list-item {
      border-start-start-radius: calc(var(--card-radius) - var(--border-width));
      border-start-end-radius: calc(var(--card-radius) - var(--border-width));
    }

    [data-theme="ios-demo"] .card > .list > li:last-child > .list-item {
      border-end-start-radius: calc(var(--card-radius) - var(--border-width));
      border-end-end-radius: calc(var(--card-radius) - var(--border-width));
    }

    /* The iOS knob floats; the core keeps it flat on purpose. */
    [data-theme="ios-demo"] .switch::before {
      box-shadow: 0 0.125rem 0.375rem rgb(0 0 0 / 15%);
    }
  </style>
</head>
<body>
  <main class="center stack ios-page">
    <h1>Settings</h1>

    <section class="stack" aria-labelledby="controls-title">
      <h2 id="controls-title" class="overline">Controls</h2>
      <div class="grid ios-gallery">
        <figure class="stack">
          <div class="card ios-stage">
            <div class="cluster">
              <button class="btn primary" type="button">Save</button>
              <button class="btn primary soft" type="button">Cancel</button>
            </div>
          </div>
          <figcaption class="muted text-center">Buttons</figcaption>
        </figure>

        <figure class="stack">
          <div class="card ios-stage">
            <input class="switch" type="checkbox" role="switch" aria-label="Wi-Fi" checked>
          </div>
          <figcaption class="muted text-center">Switch</figcaption>
        </figure>

        <figure class="stack">
          <div class="card ios-stage">
            <input class="range" data-enhance="range" type="range" min="0" max="100" value="58" aria-label="Brightness">
          </div>
          <figcaption class="muted text-center">Slider</figcaption>
        </figure>

        <figure class="stack">
          <div class="card ios-stage">
            <fieldset class="segmented sm">
              <legend class="sr-only">Range</legend>
              <label class="segment"><input type="radio" name="span" value="day">Day</label>
              <label class="segment"><input type="radio" name="span" value="week" checked>Week</label>
              <label class="segment"><input type="radio" name="span" value="month">Month</label>
            </fieldset>
          </div>
          <figcaption class="muted text-center">Segmented control</figcaption>
        </figure>

        <figure class="stack">
          <div class="card ios-stage">
            <input class="input" type="number" value="3" min="0" max="10" aria-label="Copies">
          </div>
          <figcaption class="muted text-center">Number (native stepper)</figcaption>
        </figure>

        <figure class="stack">
          <div class="card ios-stage">
            <input class="input" type="text" value="Rex" aria-label="Name">
          </div>
          <figcaption class="muted text-center">Text field</figcaption>
        </figure>
      </div>
    </section>

    <section class="stack" aria-labelledby="network-title">
      <h2 id="network-title" class="overline">Network</h2>
      <div class="card">
        <ul class="list">
          <li class="list-item">
            <span class="avatar warning" aria-hidden="true"><i class="ti ti-plane"></i></span>
            <label class="list-item-content list-item-title" for="airplane">Airplane Mode</label>
            <span class="list-item-trailing">
              <input class="switch" type="checkbox" role="switch" id="airplane">
            </span>
          </li>
          <li>
            <a class="list-item" href="#wifi">
              <span class="avatar primary" aria-hidden="true"><i class="ti ti-wifi"></i></span>
              <span class="list-item-content list-item-title">Wi-Fi</span>
              <span class="list-item-trailing muted">Home <i class="ti ti-chevron-right" aria-hidden="true"></i></span>
            </a>
          </li>
          <li>
            <a class="list-item" href="#bluetooth">
              <span class="avatar primary" aria-hidden="true"><i class="ti ti-bluetooth"></i></span>
              <span class="list-item-content list-item-title">Bluetooth</span>
              <span class="list-item-trailing muted">On <i class="ti ti-chevron-right" aria-hidden="true"></i></span>
            </a>
          </li>
          <li>
            <a class="list-item" href="#cellular">
              <span class="avatar success" aria-hidden="true"><i class="ti ti-antenna-bars-5"></i></span>
              <span class="list-item-content list-item-title">Cellular</span>
              <i class="ti ti-chevron-right list-item-trailing muted" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </div>
    </section>

    <section class="stack" aria-labelledby="display-title">
      <h2 id="display-title" class="overline">Display</h2>
      <div class="card">
        <ul class="list">
          <li class="list-item">
            <span class="list-item-content list-item-title" id="appearance-label">Appearance</span>
            <span class="list-item-trailing">
              <span class="segmented sm" role="radiogroup" aria-labelledby="appearance-label">
                <label class="segment"><input type="radio" name="appearance" value="light" checked>Light</label>
                <label class="segment"><input type="radio" name="appearance" value="dark">Dark</label>
                <label class="segment"><input type="radio" name="appearance" value="auto">Auto</label>
              </span>
            </span>
          </li>
          <li class="list-item">
            <i class="ti ti-sun-low muted" aria-hidden="true"></i>
            <input class="range list-item-content" data-enhance="range" type="range" min="0" max="100" value="70" aria-label="Brightness">
            <i class="ti ti-sun list-item-trailing muted" aria-hidden="true"></i>
          </li>
          <li class="list-item">
            <label class="list-item-content list-item-title" for="true-tone">
              True Tone
              <span class="list-item-text">Adapt the display to ambient light.</span>
            </label>
            <span class="list-item-trailing">
              <input class="switch" type="checkbox" role="switch" id="true-tone" checked>
            </span>
          </li>
        </ul>
      </div>
      <p class="muted"><small>Night Shift and Auto-Lock live under Display &amp; Brightness.</small></p>
    </section>

    <section class="stack" aria-labelledby="narrow-title">
      <h2 id="narrow-title" class="overline">Narrow column</h2>
      <div>
        <div class="card ios-narrow">
          <ul class="list">
            <li class="list-item">
              <span class="list-item-content list-item-title" id="narrow-appearance">Appearance</span>
              <span class="list-item-trailing">
                <span class="segmented sm" role="radiogroup" aria-labelledby="narrow-appearance">
                  <label class="segment"><input type="radio" name="narrow-a" value="light" checked>Light</label>
                  <label class="segment"><input type="radio" name="narrow-a" value="dark">Dark</label>
                </span>
              </span>
            </li>
            <li class="list-item">
              <label class="list-item-content list-item-title" for="narrow-notify">Notifications</label>
              <span class="list-item-trailing">
                <select class="select sm fit" id="narrow-notify">
                  <option>Immediately</option>
                  <option>Scheduled</option>
                </select>
              </span>
            </li>
            <li>
              <a class="list-item" href="#accessibility">
                <span class="list-item-content list-item-title">Accessibility</span>
                <span class="list-item-trailing muted">Larger Text <i class="ti ti-chevron-right" aria-hidden="true"></i></span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <section class="stack" aria-labelledby="account-title">
      <h2 id="account-title" class="overline">Account</h2>
      <div class="card">
        <ul class="list">
          <li class="list-item">
            <label class="list-item-content list-item-title" for="account-name">Name</label>
            <span class="list-item-trailing">
              <input class="input" id="account-name" type="text" value="Rex" autocomplete="name">
            </span>
          </li>
          <li class="list-item">
            <button class="btn danger ghost grow" type="button">Sign Out</button>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <script src="../../dist/actual.full.js"></script>
</body>
</html>
