<!doctype html>
<html lang="en" data-theme="ocean">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tasks - Actual CSS</title>
  <meta name="description" content="An inset task workspace with a divided master-detail surface and persistent mobile navigation.">
  <link rel="stylesheet" href="../../dist/actual.full.css">
  <link rel="stylesheet" href="../assets/actual-themes.min.css">
  <script src="../scripts/theme-picker.js"></script>
  <style>
    /* Inset shell: chrome sits on the canvas, the work surface is raised. */
    .task-app {
      --panel-padding: clamp(var(--space-30), 2vw, var(--space-50));
      background: var(--surface-subtle);
    }

    .task-app > .topbar {
      --cluster-justify: space-between;
      border: 0;
      background: none;
      backdrop-filter: none;
    }

    .task-app > .app-nav {
      --ui-bg: transparent;
      --ui-border: transparent;
      --app-nav-current-bg: var(--surface-raised);
      --app-nav-current-fg: var(--text);
    }

    /* Brand and toggle line up with the tile icons; on the rail, where only
       the brand mark and the toggle fit, they centre like the tiles. */
    .task-app > .app-nav > :is(header, footer) {
      justify-items: start;
      padding-inline: var(--space-30);
    }

    .task-app[data-nav="rail"] > .app-nav > :is(header, footer) {
      justify-items: center;
      padding-inline: 0;
    }

    .task-app[data-nav="rail"] .task-brand-name {
      display: none;
    }

    /* Account and toggle: quiet chrome under a hairline, not destinations. */
    .task-app > .app-nav > footer {
      gap: var(--space-10);
      padding-block-start: var(--space-20);
      padding-inline: 0;
      border-block-start: var(--border-width) solid var(--border);
    }

    .task-account {
      justify-content: flex-start;
      font-weight: var(--font-weight-semibold);
    }

    .task-account > .task-nav-text:not(svg) {
      min-inline-size: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-account svg {
      inline-size: 1rem;
      block-size: 1rem;
      margin-inline-start: auto;
      color: var(--text-muted);
    }

    .task-rail-toggle {
      color: var(--text-muted);
    }

    .task-rail-toggle svg {
      inline-size: 1.125rem;
      block-size: 1.125rem;
    }

    .task-app[data-nav="rail"] .task-rail-toggle svg {
      transform: scaleX(-1);
    }

    /* On the rail the text leaves the layout but stays the accessible name,
       as the tile labels do (.sr-only technique). */
    .task-app[data-nav="rail"] .task-nav-text {
      position: absolute;
      inline-size: 1px;
      block-size: 1px;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .task-app[data-nav="rail"] :is(.task-account, .task-rail-toggle) {
      justify-content: center;
    }

    /* Theme and shell are user preferences, so they live in the account menu. */
    .task-setting {
      display: grid;
      gap: var(--space-10);
      padding: var(--space-20) var(--space-30);
    }

    /* Global search only earns its place in the global topbar. */
    .task-search {
      display: none;
      flex: 0 1 22rem;
    }

    @media (min-width: 48rem) {
      /* Brand in the navigation: no global action justifies a desktop topbar.
         The nav header carries the brand and the account menu the theme. A
         phone hides that header and footer, so it keeps the topbar for both. */
      .task-app:not([data-shell="global"]) > .topbar {
        display: none;
      }

      /* With no topbar to share it, the band is the workspace's first row:
         card margin, border and list padding above and below a list row, so
         the brand centres on "All lists". */
      .task-app:not([data-shell="global"]) {
        --app-layout-bar-size: calc((var(--space-30) * 2 + var(--border-width)) * 2 + var(--control-size-sm));
      }

      .task-workspace {
        margin: var(--space-30) var(--space-30) var(--space-30) 0;
        border: var(--border-width) solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--surface-raised);
      }

      /* Global topbar: the layout spans it over the navigation once the nav
         header is gone; it holds identity and search, the account menu the
         theme. */
      .task-app[data-shell="global"] .task-workspace {
        margin-block-start: 0;
      }

      /* The brand lines up with the tile icons below it (nav padding + tile
         padding), the search with the work surface's end edge. */
      .task-app[data-shell="global"] > .topbar {
        padding-inline: calc(var(--space-20) + var(--space-30)) var(--space-30);
      }

      .task-app[data-shell="global"] .task-search {
        display: block;
      }

      .task-app[data-shell="global"] .task-topbar select {
        display: none;
      }
    }

    svg.task-icon {
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .task-back svg {
      inline-size: 1.25rem;
      block-size: 1.25rem;
    }

    /* .app-main scrolls; the panes inside it scroll instead. */
    .task-workspace {
      display: grid;
      grid-template-columns: 10rem minmax(0, 1fr);
      overflow: hidden;
    }

    .task-projects {
      padding: var(--space-30);
      border-inline-end: var(--border-width) solid var(--border);
      overflow: auto;
    }

    .task-panes {
      --gap: 0;
      --sidebar-layout-size: clamp(19rem, 42%, 38rem);
      --sidebar-content-min: 25rem;
      flex-wrap: nowrap;
      align-items: stretch;
      min-inline-size: 0;
      min-block-size: 0;
    }

    .task-panel {
      min-block-size: 0;
      overflow: auto;
      padding: var(--panel-padding);
    }

    .task-detail {
      border-inline-start: var(--border-width) solid var(--border);
    }

    .task-master {
      gap: var(--space-40);
      padding-inline: 0;
    }

    .task-master > :is(hgroup, #task-empty),
    .task-group h2 {
      padding-inline: var(--panel-padding);
    }

    .task-add {
      margin-inline: var(--panel-padding);
    }

    .task-group {
      gap: var(--space-10);
    }

    .task-group h2 {
      margin-block: 0;
      font-size: var(--font-size-sm);
    }

    .task-rows {
      --list-item-pad-block: var(--space-20);
      --list-item-pad-inline: var(--panel-padding);
      --list-current-inset-block: 0;
      /* Keep the focus ring visible where a row meets the scrollport edge. */
      --focus-outline-offset: calc(-1 * var(--focus-ring-width));
    }

    .task-editor {
      --measure: 68ch;
      gap: var(--space-40);
    }

    .task-editor-head {
      --cluster-justify: space-between;
      flex-wrap: nowrap;
      align-items: flex-start;
    }

    .task-editor-head hgroup {
      min-inline-size: 0;
    }

    .task-properties {
      --grid-min: 10rem;
      --gap: var(--space-30);
      padding: var(--space-30);
      border-radius: var(--radius);
      background: var(--surface-subtle);
    }

    .task-checks {
      gap: var(--space-20);
    }

    .task-back {
      display: none;
    }

    /* Keep one list and one editor in the DOM. A narrow view gives each the
       entire pane, with the app navigation still in reach. */
    @media (max-width: 68rem) {
      .task-panes {
        display: grid;
      }

      .task-detail {
        border-inline-start: 0;
        padding-block-start: 0;
        padding-inline: 0;
      }

      .task-editor {
        margin-block-start: var(--space-40);
        margin-inline: var(--panel-padding);
      }

      .task-app:not([data-detail]) .task-detail,
      .task-app[data-detail] .task-master,
      .task-close {
        display: none;
      }

      .task-back {
        --focus-outline-offset: calc(-1 * var(--focus-ring-width));
        display: flex;
        justify-content: flex-start;
        inline-size: 100%;
        min-block-size: var(--control-size-lg);
        padding-inline: var(--panel-padding);
        border: 0;
        border-block-end: var(--border-width) solid var(--border);
        border-radius: 0;
      }
    }

    /* .app-layout's bottom-navigation range. */
    @media (width < 48rem) {
      .task-workspace {
        grid-template: auto minmax(0, 1fr) / minmax(0, 1fr);
        border-block: var(--border-width) solid var(--border);
        background: var(--surface-raised);
      }

      .task-projects {
        padding: var(--space-10) var(--panel-padding);
        border-inline-end: 0;
        border-block-end: var(--border-width) solid var(--border);
      }

      .task-projects .nav-list {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-10);
      }

      .task-projects li {
        flex: 1;
      }

      .task-projects .nav-link {
        justify-content: center;
      }

      .task-app[data-detail] .task-projects {
        display: none;
      }

      .task-app[data-detail] .task-panes {
        grid-row: 2;
      }
    }
  </style>
</head>

<body>
  <div class="app-layout task-app">
    <header class="topbar cluster task-topbar">
      <span class="navbar-brand"><span class="avatar primary sm" aria-hidden="true">F</span> Fieldwork</span>
      <input class="input task-search" type="search" id="task-search" aria-label="Search tasks" placeholder="Search tasks…">
      <theme-picker><select class="select sm fit" aria-label="Switch theme"></select></theme-picker>
    </header>

    <main class="app-main task-workspace" aria-label="Task workspace">
      <nav class="scroller task-projects" aria-label="Project lists">
        <ul class="nav-list">
          <li><button class="nav-link" type="button" data-project="all" aria-current="true">All lists</button></li>
          <li><button class="nav-link" type="button" data-project="Studio">Studio</button></li>
          <li><button class="nav-link" type="button" data-project="Operations">Operations</button></li>
        </ul>
      </nav>

      <div class="sidebar-layout reverse task-panes">
        <section class="scroller stack task-panel task-master" aria-labelledby="task-heading">
          <hgroup>
            <h1 id="task-heading" tabindex="-1">All tasks</h1>
            <p id="task-summary" class="muted" aria-live="polite"></p>
          </hgroup>
          <form class="join task-add" id="task-add">
            <input class="input" name="title" aria-label="New task" placeholder="Add a task…" autocomplete="off" required>
            <button class="btn outline" type="submit">Add</button>
          </form>
          <section class="stack task-group" data-group="today" aria-labelledby="today-heading">
            <h2 id="today-heading">Today</h2>
            <ul class="list task-rows"></ul>
          </section>
          <section class="stack task-group" data-group="planned" aria-labelledby="planned-heading">
            <h2 id="planned-heading">Upcoming</h2>
            <ul class="list task-rows"></ul>
          </section>
          <section class="stack task-group" data-group="done" aria-labelledby="done-heading">
            <h2 id="done-heading">Completed</h2>
            <ul class="list task-rows"></ul>
          </section>
          <p id="task-empty" class="muted" hidden>No tasks in this view.</p>
        </section>

        <article class="scroller task-panel task-detail" id="task-detail" aria-labelledby="task-title">
          <button class="btn ghost sm task-back" type="button">
            <svg class="task-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m11 5-7 7 7 7M4 12h16"/>
            </svg>
            Back to tasks
          </button>
          <div class="measure stack task-editor">
            <div class="cluster task-editor-head">
              <hgroup>
                <p class="overline" id="task-project"></p>
                <h2 id="task-title" tabindex="-1"></h2>
              </hgroup>
              <!-- Closing hands the whole workspace back to the list. -->
              <button class="close task-close" type="button" aria-label="Close task"></button>
            </div>
            <div class="grid task-properties">
              <label class="field">
                <span class="field-label">Status</span>
                <select class="select" id="task-status">
                  <option value="today">Today</option>
                  <option value="planned">Upcoming</option>
                  <option value="done">Completed</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">List</span>
                <select class="select" id="task-list">
                  <option>Studio</option>
                  <option>Operations</option>
                </select>
              </label>
            </div>
            <fieldset class="field-group flush" id="task-checklist">
              <legend>Checklist <span class="muted" id="task-progress"></span></legend>
              <div class="stack task-checks" id="task-checks"></div>
            </fieldset>
            <label class="field">
              <span class="field-label">Notes</span>
              <textarea class="textarea" id="task-notes" rows="4"></textarea>
            </label>
          </div>
        </article>
      </div>
    </main>

    <nav class="app-nav" aria-label="Task views">
      <header>
        <span class="navbar-brand"><span class="avatar primary sm" aria-hidden="true">F</span> <span class="task-brand-name">Fieldwork</span></span>
      </header>
      <a href="#all" data-view="all" aria-current="page">
        <svg class="task-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="m3 6 1.5 1.5L7 5m-4 7 1.5 1.5L7 11m-4 7 1.5 1.5L7 17M11 6h10m-10 6h10m-10 6h10"/>
        </svg>
        <span>All tasks</span>
      </a>
      <a href="#today" data-view="today">
        <svg class="task-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="5" width="18" height="16" rx="2"/>
          <path d="M7 3v4m10-4v4M3 10h18m-10 5h2v2h-2z"/>
        </svg>
        <span>Today</span>
      </a>
      <a href="#done" data-view="done">
        <svg class="task-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9"/>
          <path d="m8 12 2.5 2.5 5-5"/>
        </svg>
        <span>Completed</span>
      </a>
      <footer>
        <div class="flyout-trigger stretch">
          <button class="btn ghost sm task-account" type="button" id="task-account-trigger" data-enhance="flyout"
            aria-expanded="false" aria-controls="task-account-menu">
            <span class="avatar primary sm" aria-hidden="true">AL</span>
            <span class="task-nav-text">Alex Lambert</span>
            <svg class="task-icon task-nav-text" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="m7 15 5-5 5 5"/>
            </svg>
          </button>
          <menu class="flyout menu" id="task-account-menu" aria-labelledby="task-account-trigger"
            data-flyout-placement="top-start" hidden>
            <li>
              <a class="menu-item" href="#profile">
                <span class="menu-item-text">Profile<span class="menu-item-desc">Name, photo and email</span></span>
              </a>
            </li>
            <li>
              <a class="menu-item" href="#preferences">
                <span class="menu-item-text">Preferences<span class="menu-item-desc">Reminders and week start</span></span>
              </a>
            </li>
            <li class="menu-separator" aria-hidden="true"></li>
            <li>
              <label class="task-setting">
                <span class="field-label">Theme</span>
                <theme-picker><select class="select sm"></select></theme-picker>
              </label>
            </li>
            <li>
              <label class="task-setting">
                <span class="field-label">Brand</span>
                <select class="select sm" id="task-shell">
                  <option value="nav">In the navigation</option>
                  <option value="global">In a global topbar</option>
                </select>
              </label>
            </li>
            <li class="menu-separator" aria-hidden="true"></li>
            <li><button class="menu-item" type="button">Sign out</button></li>
          </menu>
        </div>
        <button class="btn ghost sm task-rail-toggle" type="button">
          <svg class="task-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16m6-11-3 3 3 3"/>
          </svg>
          <span class="task-nav-text">Collapse menu</span>
        </button>
      </footer>
    </nav>
  </div>

  <template id="task-row">
    <li><a class="list-item" href="#task-detail">
      <span class="list-item-content">
        <span class="list-item-title"></span>
        <span class="list-item-text"></span>
      </span>
      <span class="list-item-trailing badge soft" hidden>Priority</span>
    </a></li>
  </template>

  <script src="../../dist/actual.full.js"></script>
  <script type="module">
    const tasks = [
      {
        title: "Review the exhibition floor plan",
        project: "Studio",
        status: "today",
        priority: true,
        notes: "Check the route from the entrance to the workshop table. Leave room by the east wall for visitors to pause without blocking the aisle.",
        checks: [
          { label: "Compare with the venue measurements", done: true },
          { label: "Mark the accessible route", done: false },
          { label: "Share the revised plan with the team", done: false },
        ],
      },
      { title: "Confirm the print delivery window", project: "Operations", status: "today" },
      {
        title: "Proof the gallery labels and check every credit line against the loan agreements before the printer's cut-off",
        project: "Studio",
        status: "today",
      },
      { title: "Call the venue about loading dock hours", project: "Operations", status: "today", priority: true },
      { title: "Reply to the lighting technician", project: "Studio", status: "today" },
      {
        title: "Set up the volunteer briefing",
        project: "Operations",
        status: "planned",
        due: "Nov 27",
        checks: [
          { label: "Book the meeting room", done: true },
          { label: "Print the floor maps", done: false },
        ],
      },
      { title: "Export the entrance signage", project: "Studio", status: "planned", due: "Nov 28" },
      {
        title: "Book the accessibility walkthrough with the venue's access officer and both wheelchair-user advisors",
        project: "Operations",
        status: "planned",
        due: "Dec 1",
        priority: true,
      },
      { title: "Draft the press preview invitation", project: "Studio", status: "planned", due: "Dec 2" },
      { title: "Order replacement spotlights", project: "Operations", status: "planned", due: "Dec 3" },
      { title: "Send the updated venue access details", project: "Operations", status: "done" },
      { title: "Collect the artist biographies", project: "Studio", status: "done" },
      { title: "Sign the insurance certificate", project: "Operations", status: "done" },
    ];

    const app = document.querySelector(".task-app");
    const groups = [...app.querySelectorAll("[data-group]")];
    const filters = [...app.querySelectorAll("[data-view], [data-project]")];
    const rowTemplate = document.getElementById("task-row");
    const heading = document.getElementById("task-heading");
    const detail = document.getElementById("task-detail");
    const title = document.getElementById("task-title");
    const status = document.getElementById("task-status");
    const list = document.getElementById("task-list");
    const notes = document.getElementById("task-notes");
    const checklist = document.getElementById("task-checklist");
    const checks = document.getElementById("task-checks");
    const narrow = matchMedia("(max-width: 68rem)");
    let view = "all";
    let project = "all";
    let query = "";
    let selected = tasks[0];

    const visibleTasks = () => tasks.filter((task) =>
      (view === "all" || view === task.status) && (project === "all" || project === task.project) &&
      (!query || task.title.toLowerCase().includes(query)));

    function renderList() {
      const visible = visibleTasks();
      const done = visible.filter((task) => task.status === "done").length;
      document.getElementById("task-summary").textContent = `${visible.length - done} open · ${done} completed`;
      document.getElementById("task-empty").hidden = visible.length > 0;

      for (const group of groups) {
        const rows = visible.filter((task) => task.status === group.dataset.group);
        group.hidden = rows.length === 0;
        group.querySelector(".list").replaceChildren(...rows.map((task) => {
          const row = rowTemplate.content.firstElementChild.cloneNode(true);
          const link = row.querySelector("a");
          if (task === selected) link.setAttribute("aria-current", "true");
          row.querySelector(".list-item-title").textContent = task.title;
          row.querySelector(".list-item-text").textContent = task.due ? `${task.project} · ${task.due}` : task.project;
          row.querySelector(".badge").hidden = !task.priority;
          link.addEventListener("click", (event) => {
            event.preventDefault();
            app.querySelector(".task-rows a[aria-current]")?.removeAttribute("aria-current");
            link.setAttribute("aria-current", "true");
            selected = task;
            app.setAttribute("data-detail", "");
            renderDetail();
            detail.scrollTop = 0;
            if (narrow.matches) title.focus({ preventScroll: true });
          });
          return row;
        }));
      }
    }

    function renderDetail() {
      detail.hidden = !selected;
      if (!selected) return;
      title.textContent = selected.title;
      document.getElementById("task-project").textContent = selected.project;
      status.value = selected.status;
      list.value = selected.project;
      notes.value = selected.notes ?? "";
      const items = selected.checks ?? [];
      checklist.hidden = items.length === 0;

      function updateProgress() {
        document.getElementById("task-progress").textContent = `${items.filter((item) => item.done).length}/${items.length}`;
      }

      checks.replaceChildren(...items.map((item) => {
        const label = document.createElement("label");
        label.className = "choice";
        const input = document.createElement("input");
        input.className = "check";
        input.type = "checkbox";
        input.checked = item.done;
        input.addEventListener("change", () => {
          item.done = input.checked;
          updateProgress();
        });
        label.append(input, item.label);
        return label;
      }));
      updateProgress();
    }

    for (const filter of filters) {
      filter.addEventListener("click", (event) => {
        event.preventDefault();
        const key = filter.hasAttribute("data-view") ? "view" : "project";
        app.querySelector(`[data-${key}][aria-current]`).removeAttribute("aria-current");
        filter.setAttribute("aria-current", key === "view" ? "page" : "true");
        view = filter.dataset.view ?? view;
        project = filter.dataset.project ?? project;
        const visible = visibleTasks();
        // A closed detail stays closed; an open one follows the filter.
        if (selected && !visible.includes(selected)) selected = visible[0] ?? null;
        app.removeAttribute("data-detail");
        if (key === "view") heading.textContent = filter.lastElementChild.textContent;
        renderList();
        renderDetail();
      });
    }

    app.querySelector(".task-back").addEventListener("click", () => {
      app.removeAttribute("data-detail");
      (app.querySelector(".task-rows a[aria-current]") ?? heading).focus();
    });

    // Closing ends the selection, so the list takes the whole workspace.
    app.querySelector(".task-close").addEventListener("click", () => {
      const row = app.querySelector(".task-rows a[aria-current]");
      row?.removeAttribute("aria-current");
      selected = null;
      app.removeAttribute("data-detail");
      renderDetail();
      (row ?? heading).focus();
    });

    // Quick add files the task where the current view and list can show it.
    document.getElementById("task-add").addEventListener("submit", (event) => {
      event.preventDefault();
      const input = event.currentTarget.elements.title;
      const text = input.value.trim();
      if (!text) return;
      tasks.unshift({
        title: text,
        project: project === "all" ? "Studio" : project,
        status: view === "all" ? "today" : view,
      });
      input.value = "";
      renderList();
    });

    status.addEventListener("change", () => {
      selected.status = status.value;
      renderList();
    });
    list.addEventListener("change", () => {
      selected.project = list.value;
      document.getElementById("task-project").textContent = selected.project;
      renderList();
    });
    notes.addEventListener("input", () => { selected.notes = notes.value; });

    // The rail is the application's preference: .app-layout only draws it.
    const railToggle = app.querySelector(".task-rail-toggle");
    function setRail(rail) {
      if (rail) app.setAttribute("data-nav", "rail");
      else app.removeAttribute("data-nav");
      // A label swap, not aria-pressed: a pressed .btn paints a selected fill
      // that would compete with the current destination.
      railToggle.querySelector(".task-nav-text").textContent = rail ? "Expand menu" : "Collapse menu";
      try { localStorage.setItem("tasks-rail", rail ? "1" : ""); } catch {}
    }
    railToggle.addEventListener("click", () => setRail(!app.hasAttribute("data-nav")));
    try { setRail(localStorage.getItem("tasks-rail") === "1"); } catch {}

    // Where the brand lives decides the shell: without the nav header,
    // .app-layout spans the topbar over the navigation. The app only moves it.
    const nav = app.querySelector(".app-nav");
    const navHeader = nav.querySelector(":scope > header");
    const shell = document.getElementById("task-shell");
    const search = document.getElementById("task-search");
    function setShell(global) {
      if (global) {
        app.dataset.shell = "global";
        navHeader.remove();
      } else {
        delete app.dataset.shell;
        nav.prepend(navHeader);
        // The search leaves with the global topbar; so does its filter.
        search.value = "";
        query = "";
        renderList();
      }
      shell.value = global ? "global" : "nav";
      try { localStorage.setItem("tasks-shell", global ? "global" : ""); } catch {}
    }
    shell.addEventListener("change", () => setShell(shell.value === "global"));
    try { if (localStorage.getItem("tasks-shell") === "global") setShell(true); } catch {}

    search.addEventListener("input", () => {
      query = search.value.trim().toLowerCase();
      renderList();
    });

    renderList();
    renderDetail();
  </script>
</body>

</html>
