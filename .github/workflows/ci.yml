name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      # dist/ and site/ are build output; only these generated metadata files
      # are committed and must remain unchanged after a build.
      - name: Verify committed build output
        run: |
          git diff --exit-code -- size-report.json components.json reserved-classes.json
          test -z "$(git ls-files --others --exclude-standard -- size-report.json components.json reserved-classes.json)"
      - name: Stage GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: mkdir -p _pages && cp -r index.html .nojekyll site dist src demo scripts docs _pages/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: _pages

  pages:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Pushing a tag publishes the release: the notes are the dated changelog
  # section for that version, and release assets are built rather than committed.
  # Gated on build, so a tag that does not build never gets a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build:dist
      - run: bun run build:js
      - name: Extract release notes
        run: bun run release:notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag $PRERELEASE
          dist/*
