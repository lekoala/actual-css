name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:all
      # dist/, site/ and size-report.json are committed: a build that produces
      # anything different from what is tracked must fail the pipeline.
      - name: Verify committed build output
        run: |
          git diff --exit-code -- dist site size-report.json components.json reserved-classes.json
          test -z "$(git ls-files --others --exclude-standard -- dist site size-report.json components.json reserved-classes.json)"

  # Pushing a tag publishes the release: the notes are the dated changelog
  # section for that version, and the committed dist/ files ride along as
  # assets. Gated on build, so a tag that does not build never gets a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Extract release notes
        run: bun run release:notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file "$RUNNER_TEMP/notes.md"
          --verify-tag $PRERELEASE
          dist/*
